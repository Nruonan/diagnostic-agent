services:
  diagnostic-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATA_SOURCE_MODE: http
      ELK_API_URL: http://datasource-mock:9000/elk
      XXL_JOB_API_URL: http://datasource-mock:9000/xxl-job
      SLOW_QUERY_API_URL: http://datasource-mock:9000/slow-query
      TRACE_API_URL: http://datasource-mock:9000/trace
      GIT_CODE_API_URL: http://datasource-mock:9000/git-code
      RUNTIME_DIR: /app/.runtime
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      WEBHOOK_DEDUP_COOLDOWN_SECONDS: ${WEBHOOK_DEDUP_COOLDOWN_SECONDS:-300}
    ports:
      - "8010:8000"
    depends_on:
      - datasource-mock
    volumes:
      - diagnostic_runtime:/app/.runtime

  datasource-mock:
    build:
      context: .
      dockerfile: docker/datasource-mock/Dockerfile
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      XXL_JOB_MYSQL_HOST: xxl-job-mysql
      XXL_JOB_MYSQL_PORT: 3306
      XXL_JOB_MYSQL_DATABASE: xxl_job
      XXL_JOB_MYSQL_USER: xxl_job
      XXL_JOB_MYSQL_PASSWORD: ${XXL_JOB_DB_PASSWORD:-xxl_job}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-}
      GITHUB_REF: ${GITHUB_REF:-}
      GITHUB_CODE_MAX_RESULTS: ${GITHUB_CODE_MAX_RESULTS:-5}
    ports:
      - "9000:9000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      xxl-job-mysql:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - diagnostic-api
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  zabbix-mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_ROOT_PASSWORD:-zabbix_root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - zabbix_mysql_data:/var/lib/mysql

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      ZBX_STARTPOLLERS: 5
      ZBX_STARTPINGERS: 2
    ports:
      - "10051:10051"
    depends_on:
      zabbix-mysql:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      PHP_TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8081:8080"
    depends_on:
      - zabbix-server

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
    depends_on:
      - zabbix-server

  xxl-job-mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl_job
      MYSQL_PASSWORD: ${XXL_JOB_DB_PASSWORD:-xxl_job}
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_DB_ROOT_PASSWORD:-xxl_job_root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./docker/xxl-job/init:/docker-entrypoint-initdb.d:ro
      - xxl_job_mysql_data:/var/lib/mysql

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=xxl_job
        --spring.datasource.password=${XXL_JOB_DB_PASSWORD:-xxl_job}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default_token}
    ports:
      - "8082:8080"
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    volumes:
      - xxl_job_logs:/data/applogs

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9202:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  elastalert:
    image: ghcr.io/jertel/elastalert2/elastalert2:2.28.0
    volumes:
      - ./docker/elastalert/config.yaml:/opt/elastalert/config.yaml:ro
      - ./docker/elastalert/rules:/opt/elastalert/rules:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      diagnostic-api:
        condition: service_started

volumes:
  diagnostic_runtime:
  prometheus_data:
  alertmanager_data:
  zabbix_mysql_data:
  xxl_job_mysql_data:
  xxl_job_logs:
  elasticsearch_data:
